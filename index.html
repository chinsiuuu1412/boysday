<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Super Mario – Cứu Công Chúa</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="256" height="240"></canvas>

    <!-- Màn nhập: chọn ban + tên -->
<div class="ov" id="ui">
  <select id="ban"><option value="">Chọn ban của bạn</option></select>
  <input id="nm" maxlength="40" placeholder="Tên của bạn" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="go">START</button>
  <div id="err"></div>
</div>

<!-- Hỏi xác nhận / chọn đúng người khi tên trùng hoặc gõ gần đúng -->
<div class="ov" id="pick">
  <h3 id="pickT"></h3>
  <div id="pickL"></div>
  <button id="pickBack">NHẬP LẠI</button>
</div>

    <!-- Bảng phần thưởng sau khi mở rương -->
    <div class="ov" id="rw">
      <h2 id="rt"></h2>
      <p id="rd"></p>
      <a class="btn" id="cta"></a>
      <button id="again">CHƠI LẠI</button>
    </div>
  </div>

  <div id="hint"></div>

  <!-- Nút điều khiển trên điện thoại -->
  <div id="pad">
    <div><button data-k="L">◀</button><button data-k="R">▶</button></div>
    <div><button data-k="F">B</button><button data-k="J">A</button></div>
  </div>

  <!-- Cửa sổ thiệp (phần thưởng của rương) -->
<div id="cardModal">
  <div id="cardSizer">
    <div class="card-container">

      <!-- Bìa thiệp có dấu sáp đỏ -->
      <div class="card-cover" id="cardCover">
        <div class="paper-texture">
          <div class="wax-seal-stamp" id="waxStamp">
            <span>❤️</span>
            <div class="stamp-ring">eHub</div>
          </div>
          <p class="cover-hint">Chạm để mở thiệp</p>
        </div>
      </div>

      <!-- Nội dung bức thư -->
      <div class="card-inside" id="cardInside">
        <div class="stamp-photo-frame">
          <img id="cardPhoto" src="" alt="Tem kỷ niệm" class="stamp-photo">
        </div>

        <div class="card-content">
          <div class="half-open-text" id="halfText">
            <h2 class="salutation" id="toHalf"></h2>
            <p class="swipe-hint">↑ Vuốt lên hoặc bấm để đọc tiếp thư</p>
          </div>

          <div class="full-open-text" id="fullText">
            <h2 class="salutation" id="toFull"></h2>
            <p class="message-body" id="cardMsg"></p>
            <div class="signature"><span id="cardSig"></span></div>
            <div class="card-actions">
                <button class="close-btn" id="closeBtn">← Đóng thiệp lại</button>
                <button class="dl-btn" id="dlBtn">⬇ Tải thiệp (PNG)</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
  <button id="again">CHƠI LẠI</button>
</div>
  <script src="people.js"></script>
  <script src="script.js"></script>
</body>
</html>
